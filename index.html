<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <meta name="google-site-verification" content="yL2c-dbeRzSF7NiyHPbGmlBgKMd8i-MO0_Cd706fLTw" />
    <style>
        /* ── reset & base ── */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            background: rgba(255, 255, 255, 0.92);
            padding: 28px 30px 34px;
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
            max-width: 520px;
            width: 100%;
            backdrop-filter: blur(2px);
            transition: 0.3s;
        }

        /* ── header with link ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 4px;
        }
        h1 {
            color: #222;
            font-size: 28px;
            margin: 0;
            letter-spacing: 0.5px;
        }
        .header-link {
            color: #e91e63;
            font-size: 20px;
            font-weight: 600;
            text-decoration: none;
            background: #ffe6ed;
            padding: 2px 14px 4px;
            border-radius: 30px;
            transition: background 0.25s, transform 0.2s;
            display: inline-block;
            border: 1px solid #f8c8d6;
        }
        .header-link:hover {
            background: #ffccdb;
            transform: scale(1.04);
        }

        /* ── mode select ── */
        .mode-select {
            margin: 12px 0 16px;
            padding: 10px 22px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            border-radius: 40px;
            background: #fce4ec;
            color: #1a1a1a;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(233, 30, 99, 0.2);
            transition: background 0.3s, transform 0.2s;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }
        .mode-select:hover {
            background: #f8bbd0;
            transform: scale(1.03);
        }
        .mode-select:active {
            transform: scale(0.97);
        }

        /* ── board ── */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 18px auto 16px;
            max-width: 360px;
        }
        .cell {
            aspect-ratio: 1/1;
            background: #ffeb3b;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            color: #1a1a1a;
            cursor: pointer;
            transition: background 0.25s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 6px 0 #d4b800, 0 8px 20px rgba(0, 0, 0, 0.15);
            user-select: none;
        }
        .cell:hover {
            background: #ffc107;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #b89500, 0 12px 28px rgba(0, 0, 0, 0.2);
        }
        .cell:active {
            transform: scale(0.94);
            box-shadow: 0 2px 0 #b89500;
        }

        /* ── winner & reset ── */
        .winner {
            color: #2e7d32;
            font-size: 24px;
            font-weight: 700;
            min-height: 44px;
            margin: 4px 0 12px;
            background: #e8f5e9;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
        }
        .reset-button {
            background: #e91e63;
            color: #fff;
            border: none;
            padding: 12px 34px;
            font-size: 19px;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 6px 0 #ad1457, 0 6px 16px rgba(233, 30, 99, 0.3);
            letter-spacing: 0.3px;
            margin-top: 4px;
        }
        .reset-button:hover {
            background: #c2185b;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #8e0f3f, 0 10px 24px rgba(233, 30, 99, 0.35);
        }
        .reset-button:active {
            transform: scale(0.96);
            box-shadow: 0 2px 0 #8e0f3f;
        }

        /* ── footer link ── */
        .footer-link {
            display: block;
            margin-top: 22px;
            font-size: 16px;
            font-weight: 500;
            color: #555;
            text-decoration: none;
            background: #f3f3f3;
            padding: 8px 18px;
            border-radius: 40px;
            transition: background 0.25s, color 0.25s, transform 0.2s;
            border: 1px solid #ddd;
        }
        .footer-link strong {
            color: #1a1a1a;
            font-weight: 700;
        }
        .footer-link:hover {
            background: #e91e63;
            color: #fff;
            border-color: #e91e63;
            transform: scale(1.02);
        }
        .footer-link:hover strong {
            color: #fff;
        }

        /* ── responsive ── */
        @media (max-width: 440px) {
            .container {
                padding: 18px 16px 24px;
            }
            h1 {
                font-size: 22px;
            }
            .header-link {
                font-size: 16px;
                padding: 2px 12px 3px;
            }
            .cell {
                font-size: 36px;
            }
            .board {
                gap: 8px;
            }
            .reset-button {
                padding: 10px 24px;
                font-size: 17px;
            }
            .footer-link {
                font-size: 14px;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ─── HEADER with dofollow link #1 ─── -->
        <div class="header">
            <h1>🎮 Tic Tac Toe</h1>
            <a href="https://imaguai.com/" class="header-link" rel="dofollow" target="_blank">
                ImaguAI
            </a>
        </div>

        <!-- mode selection -->
        <select id="mode" class="mode-select">
            <option value="2p">👥 Two Player</option>
            <option value="ai">🤖 Single Player (vs AI)</option>
        </select>

        <!-- game board -->
        <div class="board" id="board"></div>

        <!-- winner message -->
        <div class="winner" id="winner"></div>

        <!-- reset button -->
        <button class="reset-button" id="reset">🔄 Restart Game</button>

        <!-- ─── FOOTER with dofollow link #2 ─── -->
        <a href="https://imaguai.com/" class="footer-link" rel="dofollow" target="_blank">
            ⚡ <strong>ImaguAI</strong> — AI-powered image tools
        </a>

    </div>

    <script>
        // ─── DOM refs ───
        const boardElement = document.getElementById("board");
        const winnerElement = document.getElementById("winner");
        const resetButton = document.getElementById("reset");
        const modeSelect = document.getElementById("mode");

        let board = Array(9).fill("");
        let currentPlayer = "X";
        let gameOver = false;

        // ─── render ───
        function renderBoard() {
            boardElement.innerHTML = "";
            board.forEach((cell, index) => {
                const cellElement = document.createElement("div");
                cellElement.classList.add("cell");
                cellElement.textContent = cell;
                cellElement.addEventListener("click", () => handleMove(index));
                boardElement.appendChild(cellElement);
            });
        }

        // ─── move handler ───
        function handleMove(index) {
            if (board[index] || gameOver) return;

            board[index] = currentPlayer;
            checkWinner();

            // switch player
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            renderBoard();

            // AI turn (if in AI mode and it's O's turn)
            if (!gameOver && modeSelect.value === "ai" && currentPlayer === "O") {
                setTimeout(aiMove, 500);
            }
        }

        // ─── AI move (minimax) ───
        function aiMove() {
            const bestMove = minimax(board, "O");
            if (bestMove && bestMove.index !== undefined) {
                board[bestMove.index] = "O";
                checkWinner();
                currentPlayer = "X";
                renderBoard();
            }
        }

        // ─── minimax ───
        function minimax(board, player) {
            const availableSpots = board
                .map((v, i) => (v === "" ? i : null))
                .filter(v => v !== null);

            if (checkWinnerCondition(board, "X")) return { score: -10 };
            if (checkWinnerCondition(board, "O")) return { score: 10 };
            if (availableSpots.length === 0) return { score: 0 };

            let moves = [];
            availableSpots.forEach(spot => {
                const move = { index: spot };
                board[spot] = player;
                const result = minimax(board, player === "O" ? "X" : "O");
                move.score = result.score;
                board[spot] = "";
                moves.push(move);
            });

            let bestMove;
            if (player === "O") {
                let bestScore = -Infinity;
                moves.forEach(move => {
                    if (move.score > bestScore) {
                        bestScore = move.score;
                        bestMove = move;
                    }
                });
            } else {
                let bestScore = Infinity;
                moves.forEach(move => {
                    if (move.score < bestScore) {
                        bestScore = move.score;
                        bestMove = move;
                    }
                });
            }
            return bestMove;
        }

        // ─── win check ───
        function checkWinnerCondition(board, player) {
            const winPatterns = [
                [0, 1, 2],
                [3, 4, 5],
                [6, 7, 8],
                [0, 3, 6],
                [1, 4, 7],
                [2, 5, 8],
                [0, 4, 8],
                [2, 4, 6]
            ];
            return winPatterns.some(pattern => {
                const [a, b, c] = pattern;
                return board[a] === player && board[b] === player && board[c] === player;
            });
        }

        function checkWinner() {
            if (checkWinnerCondition(board, "X")) {
                winnerElement.textContent = "🏆 X Wins!";
                gameOver = true;
            } else if (checkWinnerCondition(board, "O")) {
                winnerElement.textContent = "🏆 O Wins!";
                gameOver = true;
            } else if (!board.includes("")) {
                winnerElement.textContent = "🤝 It's a draw!";
                gameOver = true;
            } else {
                // no winner yet – clear message if it was showing stale text
                if (!gameOver) winnerElement.textContent = "";
            }
        }

        // ─── reset ───
        resetButton.addEventListener("click", () => {
            board = Array(9).fill("");
            currentPlayer = "X";
            gameOver = false;
            winnerElement.textContent = "";
            renderBoard();
        });

        // ─── start ───
        renderBoard();
    </script>

</body>
</html>
